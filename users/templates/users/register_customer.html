{% extends 'main/base.html' %} 
{% block title %}
  Customer Registration - Netfix
{% endblock %}

{% block content %}
    <div style="text-align: center; margin-bottom: 20px;">
        <p class="title" style="margin-bottom: 8px;">Customer Registration</p>
        <p style="color: var(--text-muted); font-size: 1.05rem; margin: 0;">Create a customer account to request and track home services</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        {{ form }}
        <button type="submit" name="register" style="margin-top: 10px;">Register Account</button>
    </form>

    <div style="text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 0.92rem;">
        Already have an account? <a href="/register/login/" class="font-bold" style="color: var(--accent-light);">Sign In</a>
    </div>
{% endblock %}
