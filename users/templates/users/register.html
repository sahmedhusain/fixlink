{% extends 'main/base.html' %} 
{% block title %}
  Select Account Type - Netfix
{% endblock %}

{% block content %}
    <p class="choice_text">Join Netfix Today</p>
    <p style="text-align: center; margin-top: -24px; margin-bottom: 36px; color: var(--text-muted); font-size: 1.05rem;">Select your account type to get started with on-demand home services</p>
    
    <div class="choice-container">
        <div class="choice">
            <div class="company img" id="company">
                <a href="/register/company">
                    <img src="/static/css/company.png" alt="Company Registration">
                </a>
            </div>
            <p class="label_images">Company Account</p>
        </div>

        <div class="choice">
            <div class="img" id="customer">
                <a href="/register/customer">
                    <img src="/static/css/customer.png" alt="Customer Registration">
                </a>
            </div>
            <p>Customer Account</p>
        </div>
    </div>
{% endblock %}
