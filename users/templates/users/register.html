{% extends 'main/base.html' %} 
{% block title %}
  Select User Type - Netfix
{% endblock %}

{% block content %}
    <p class="choice_text">Choose whether you want to register as a Customer or a Company</p>
    
    <div class="choice-container">
        <div class="choice">
            <div class="company img" id="company">
                <a href="/register/company">
                    <img src="/static/css/company.png" alt="Company Registration">
                </a>
            </div>
            <p class="label_images">Company</p>
        </div>

        <div class="choice">
            <div class="img" id="customer">
                <a href="/register/customer">
                    <img src="/static/css/customer.png" alt="Customer Registration">
                </a>
            </div>
            <p>Customer</p>
        </div>
    </div>
{% endblock %}
